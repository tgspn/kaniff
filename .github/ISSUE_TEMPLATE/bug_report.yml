name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in as much detail as you can.

  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - CLI (kaniff)
        - Desktop app
        - Both
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: "base64, jwt, json, regex, ..."

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact command and input you used.
      placeholder: |
        1. Run `kaniff base64 decode ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the full output or error message.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kaniff version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true
